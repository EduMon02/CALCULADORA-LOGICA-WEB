<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Lógica Proposicional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>

<main>
  <header>
    <div class="titulo-wrap">
      <span class="label-top">LÓGICA PROPOSICIONAL</span>
      <h1>Tabla de<br><em>Verdad</em></h1>
    </div>
    <p class="subtitulo">Ingresa una expresión con variables como <code>p</code>, <code>q</code>, <code>r</code> y operadores lógicos.</p>
  </header>

  <section class="input-section">
    <div class="input-wrap">
      <input id="expresion" type="text" placeholder="Ej: (p ∧ q) → ¬r" autocomplete="off" spellcheck="false">
      <button class="btn-calcular" onclick="resolver()">
        <span>Generar</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="operadores">
      <div class="op-grupo">
        <span class="op-label">Operadores</span>
        <button class="op-btn" onclick="add('∧')" title="AND"><span class="op-sym">∧</span><span class="op-name">AND</span></button>
        <button class="op-btn" onclick="add('∨')" title="OR"><span class="op-sym">∨</span><span class="op-name">OR</span></button>
        <button class="op-btn" onclick="add('¬')" title="NOT"><span class="op-sym">¬</span><span class="op-name">NOT</span></button>
        <button class="op-btn" onclick="add('→')" title="IMPLICA"><span class="op-sym">→</span><span class="op-name">IMPL</span></button>
        <button class="op-btn" onclick="add('↔')" title="BICONDICIONAL"><span class="op-sym">↔</span><span class="op-name">BICOND</span></button>
        <button class="op-btn" onclick="add('⊕')" title="XOR"><span class="op-sym">⊕</span><span class="op-name">XOR</span></button>
      </div>
      <div class="op-grupo">
        <span class="op-label">Paréntesis</span>
        <button class="op-btn paren" onclick="add('(')"><span class="op-sym">(</span></button>
        <button class="op-btn paren" onclick="add(')')"><span class="op-sym">)</span></button>
        <button class="op-btn paren borrar" onclick="borrar()" title="Borrar último"><span class="op-sym">⌫</span></button>
      </div>
    </div>
  </section>

  <div id="error-msg" class="error-msg" style="display:none"></div>
  <div id="clasificacion" class="clasificacion" style="display:none"></div>
  <div id="tabla-wrap"></div>

</main>

<script src="script.js"></script>
</body>
</html>
