<body>

<h1>Calculadora de Lógica Computacional</h1>

<input id="expresion" placeholder="Ej: (p ∧ q) → ¬r">

<div class="panel">

<button onclick="add('∧')">∧ AND</button>
<button onclick="add('∨')">∨ OR</button>
<button onclick="add('¬')">¬ NOT</button>
<button onclick="add('→')">→ IMPLICA</button>
<button onclick="add('↔')">↔ BICONDICIONAL</button>
<button onclick="add('⊕')">⊕ XOR</button>

<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>

</div>

<br>

<button class="calcular" onclick="resolver()">Generar tabla de verdad</button>

<div id="tabla"></div>

<script src="script.js"></script>
